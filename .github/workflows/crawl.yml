name: EV Subsidy Crawler

on:
  schedule:
    # 정각(minute 0)은 GitHub Actions 고부하 시간이므로 피함
    # 참고: https://docs.github.com/en/actions/how-tos/troubleshoot-workflows#scheduled-workflows-running-at-unexpected-times
    - cron: '17 23 * * 0-4'      # UTC 23:17 = KST 08:17 (월-금)
    - cron: '17 6 * * 1-5'       # UTC 06:17 = KST 15:17 (월-금)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright holidays
          playwright install chromium
          playwright install-deps
      - name: Check Korean holiday
        id: holiday
        run: |
          python -c "
          import holidays, datetime
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          kr = holidays.KR()
          if today in kr:
              print(f'{today} is a holiday: {kr[today]}')
              print('skip=true')
          else:
              print(f'{today} is not a holiday')
              print('skip=false')
          " | tee /dev/stderr | tail -1 | sed 's/skip=//' | xargs -I{} echo "skip={}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - ignoring holiday check"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Backup previous data
        if: steps.holiday.outputs.skip != 'true'
        run: |
          if [ -f data/ev_subsidy_data.csv ]; then
            cp data/ev_subsidy_data.csv data/ev_subsidy_data_prev.csv
          fi
          if [ -f data/kg_mobility_subsidy.csv ]; then
            cp data/kg_mobility_subsidy.csv data/kg_mobility_subsidy_prev.csv
          fi

      - name: Run crawlers
        if: steps.holiday.outputs.skip != 'true'
        run: |
          python src/crawl_ev_subsidy.py
          python src/ev_crawler.py

      - name: Generate report
        if: steps.holiday.outputs.skip != 'true'
        run: python src/report_generator.py

      - name: Check for changes
        if: steps.holiday.outputs.skip != 'true'
        id: changes
        run: |
          git add data/*.csv reports/*.md reports/*.html
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Get report file path
        id: report
        if: steps.holiday.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          REPORT_FILE=$(ls -t reports/*.html 2>/dev/null | head -1)
          if [ -n "$REPORT_FILE" ]; then
            echo "file=$REPORT_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Commit results
        if: steps.holiday.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update EV subsidy data"
          git pull --rebase origin main
          git push

      - name: Send email notification
        if: steps.holiday.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[EV 보조금] 데이터 업데이트 알림"
          to: ${{ secrets.MAIL_TO }}
          from: EV 보조금 크롤러
          body: |
            EV 보조금 데이터가 업데이트되었습니다.

            첨부된 HTML 보고서를 확인해주세요.
          attachments: data/ev_subsidy_data.csv,data/kg_mobility_subsidy.csv,${{ steps.report.outputs.file }}
